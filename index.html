<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Telauto.md – anunțuri gratuite în Moldova</title>
    <!-- default description; each page replaces it (src/app/usePageMeta.ts) -->
    <meta
      name="description"
      content="Telefoane, accesorii, autovehicule și piese auto. Anunțuri gratuite în Moldova, căutare sigură. Телефоны, аксессуары, авто и запчасти."
    />
    <meta name="theme-color" content="#ffffff" />
    <!-- light / dark mode before the page is drawn (no white flash); see src/lib/theme.ts -->
    <script>
      try {
        var saved = localStorage.getItem('telauto.theme')
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#162032')
        }
      } catch (e) {}
    </script>

    <!-- link previews on Facebook, Viber, Telegram, WhatsApp (the same for every page on GitHub Pages) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Telauto.md" />
    <meta property="og:locale" content="ro_MD" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta property="og:url" content="https://lupudan.github.io/telauto/" />
    <meta property="og:title" content="Telauto.md – anunțuri gratuite în Moldova" />
    <meta
      property="og:description"
      content="Telefoane, accesorii, autovehicule și piese auto. Publicare gratuită, căutare sigură."
    />
    <meta property="og:image" content="https://lupudan.github.io/telauto/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Telauto.md – telefoane, accesorii, autovehicule, piese auto" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <noscript>
      <div style="padding: 24px; font-family: sans-serif; text-align: center">
        Telauto.md are nevoie de JavaScript. Activează JavaScript în browser și reîncarcă pagina.<br />
        Для работы Telauto.md нужен JavaScript. Включите его в браузере и обновите страницу.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
